app:
  name: "Linkdead"
  version: "v1"

server:
  host: "localhost"
  port: 5001
  trustProxy: false
  allowedCorsOrigins:
    - "http://localhost:3000"
  apiPathPrefix: "api:prod"
  docsPathPrefix: "docs:prod"

logger:
  adapter: "Winston"
  level: "debug"
  dir: "logs"
  activeLogFiles: false

database:
  adapter: "PostgreSQl"

redis:
  adapter: "IORedis"
  appDb: 0
  appKeyPrefix: "linkdead_prod"
  jobsDb: 1
  jobsKeyPrefix: "linkdead_prod_jobs"
