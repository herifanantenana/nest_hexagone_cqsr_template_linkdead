app:
  name: "Linkdead"
  version: "v1"

server:
  host: "10.11.200.229"
  port: 5001
  trustProxy: true
  allowedCorsOrigins:
    - "https://localhost:3000"
  apiPathPrefix: "api-prod"
  docsPathPrefix: "docs-prod"

logger:
  engine: "Winston"
  level: "debug"
  dir: "logs"
  activeLogFiles: false

database:
  engine: "PostgreSQL"

redis:
  engine: "IORedis"
  appDb: 0
  appKeyPrefix: "linkdead_prod"
  jobsDb: 1
  jobsKeyPrefix: "linkdead_prod_jobs"

mailer:
  engine: "Nodemailer"
  host: "smtp.gmail.com"
  fromSupport: "Linkdead <support@arakotom.com>"
  fromNoReply: "Linkdead <noreply@arakotom.com>"
  templatesDir: "./src/core/infra/mailer/adapters/templates"

rateLimiter:
  engine: "Throttler"
  policies:
    - name: "GLOBAL"
      ttlSec: 60
      limit: 300
    - name: "AUTH_LOGIN"
      ttlSec: 900
      limit: 10
    - name: "AUTH_REGISTER"
      ttlSec: 3600
      limit: 5
    - name: "AUTH_PASSWORD_RESET"
      ttlSec: 900
      limit: 3
    - name: "AUTH_EMAIL_VERIFY"
      ttlSec: 300
      limit: 5
    - name: "API_HEAVY"
      ttlSec: 60
      limit: 20
