app:
  name: "Linkdead"
  version: "v1"

server:
  port: 5000
  trustProxy: false
  allowedCorsOrigins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  apiPathPrefix: "api"
  docsPathPrefix: "docs"

client:
  registerVerifyEmailPath: "auth/verify-email"

logger:
  engine: "Winston"
  level: "verbose"
  dir: "logs"
  activeLogFiles: false

database:
  engine: "PostgreSQL"

redis:
  engine: "IORedis"
  appDb: 0
  appKeyPrefix: "linkdead_dev"
  jobsDb: 1
  jobsKeyPrefix: "linkdead_dev_jobs"

mailer:
  engine: "Nodemailer"
  host: "smtp.gmail.com"
  fromSupport: "Linkdead <support@arakotom.com>"
  fromNoReply: "Linkdead <noreply@arakotom.com>"
  templatesDir: "./src/core/infra/mailer/adapters/templates"

rateLimiter:
  engine: "Throttler"
  policies:
    - name: "GLOBAL"
      ttlSec: 15
      limit: 200
    - name: "AUTH_LOGIN"
      ttlSec: 15
      limit: 20
    - name: "AUTH_REGISTER_REQUEST"
      ttlSec: 15
      limit: 10
    - name: "AUTH_REGISTER_CONFIRM_TOKEN"
      ttlSec: 15
      limit: 5
    - name: "AUTH_PASSWORD_RESET"
      ttlSec: 15
      limit: 10
    - name: "AUTH_EMAIL_VERIFY"
      ttlSec: 15
      limit: 15
    - name: "API_HEAVY"
      ttlSec: 15
      limit: 30

auth:
  registration:
    tokenTtlSec: 1800
    tokenCooldown:
      ttlSec: 600
      maxAttempts: 3

jwt:
  accessTokenTtlSec: 900
  refreshTokenTtlSec: 604800
