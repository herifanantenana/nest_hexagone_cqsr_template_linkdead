app:
  name: "Linkdead"
  version: "v1"

server:
  host: "localhost"
  port: 5000
  trustProxy: false
  allowedCorsOrigins:
    - "*"
  apiPathPrefix: "api:dev"
  docsPathPrefix: "docs:dev"

logger:
  engine: "Winston"
  level: "debug"
  dir: "logs"
  activeLogFiles: false

database:
  engine: "PostgreSQl"

redis:
  engine: "IORedis"
  appDb: 0
  appKeyPrefix: "linkdead_dev"
  jobsDb: 1
  jobsKeyPrefix: "linkdead_dev_jobs"
