app:
  name: "Linkdead"
  version: "v1"

server:
  host: "0.0.0.0"
  port: 5000
  trustProxy: false
  allowedCorsOrigins:
    - "*"
  apiPathPrefix: "api-dev"
  docsPathPrefix: "docs-dev"

logger:
  engine: "Winston"
  level: "verbose"
  dir: "logs"
  activeLogFiles: false

database:
  engine: "PostgreSQL"

redis:
  engine: "IORedis"
  appDb: 0
  appKeyPrefix: "linkdead_dev"
  jobsDb: 1
  jobsKeyPrefix: "linkdead_dev_jobs"

mailer:
  engine: "Nodemailer"
  host: "smtp.gmail.com"
  fromSupport: "Linkdead <support@arakotom.com>"
  fromNoReply: "Linkdead <noreply@arakotom.com>"
  templatesDir: "./src/core/infra/mailer/adapters/templates"

rateLimiter:
  engine: "Throttler"
  registerRequest:
    limit: 3
    ttlSec: 30
