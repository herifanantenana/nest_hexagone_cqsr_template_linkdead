app:
  name: "Linkdead"
  version: "v1"

server:
  host: "127.0.0.1"
  port: 5000
  trustProxy: false
  allowedCorsOrigins:
    - "*"
  apiPathPrefix: "api-dev"
  docsPathPrefix: "docs-dev"

logger:
  engine: "Winston"
  level: "verbose"
  dir: "logs"
  activeLogFiles: false

database:
  engine: "PostgreSQL"

redis:
  engine: "IORedis"
  appDb: 0
  appKeyPrefix: "linkdead_dev"
  jobsDb: 1
  jobsKeyPrefix: "linkdead_dev_jobs"

mailer:
  engine: "Nodemailer"
  host: "smtp.gmail.com"
  fromSupport: "Linkdead <support@arakotom.com>"
  fromNoReply: "Linkdead <noreply@arakotom.com>"
  templatesDir: "./src/core/infra/mailer/adapters/templates"

rateLimiter:
  engine: "Throttler"
  policies:
    # Short windows (15s) + generous limits
    - name: "GLOBAL"
      ttlSec: 15
      limit: 200
    - name: "AUTH_LOGIN"
      ttlSec: 15
      limit: 20
    - name: "AUTH_REGISTER"
      ttlSec: 15
      limit: 10 
    - name: "AUTH_PASSWORD_RESET"
      ttlSec: 15
      limit: 10
    - name: "AUTH_EMAIL_VERIFY"
      ttlSec: 15
      limit: 15
    - name: "API_HEAVY"
      ttlSec: 15
      limit: 30
